<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content=" ">
  <meta name="description" content=" ">
  <meta name="keywords" content=" ">
  <link rel="shortcut icon" type="image/x-icon" href="/img/logo.png">
  <link rel="stylesheet" href="/style/style.css" />
  <link rel="stylesheet" href="/style/bootstrap-icons.css">
  <title>Sign In</title>
</head>

<body>

  <!-- LOGIN PAGE -->
  <div class="d-grid place-content-center pos-fixed top inset-0 clr-bg-primary blur-effect">
    <div class="pos-ab left m-high">
      <a href="/index.html"><i class="bi bi-arrow-90deg-left clr-text-white"></i></a>
    </div>
    <span class="text-center clr-text-light"><a href="/register.html"><i class="bi bi-person-plus-fill"></a></i></span>
    <h2 class="h2 uppercase clr-text-light text-center">Sign In</h2>
    <form class="p-high" id="loginForm">
      <div class="m-bottom-tiny">
        <label class="fw-600 clr-text-accent p-tiny" for="email">Email:</label>
        <input class="width-100 fw-600 rounded p-tiny" type="email" name="email" id="email" placeholder="Enter email">
      </div>
      <div class="m-bottom-tiny">
        <label class="fw-600 clr-text-accent p-tiny" for="password">Password:</label>
        <input class="width-100 fw-600 rounded p-tiny" type="password" name="password" id="password"
          placeholder="Enter Password">
      </div>
      <div class="m-bottom d-flex gap-100 space-between">
        <div>
          <input class="shadow" type="checkbox" name="saveLogin" id="saveLogin">
          <span class="clr-text-light-50">Save Login</span>
        </div>
        <div>
          <span class="clr-text-light-50">Forget Password?</span>
        </div>
      </div>
      <div class="d-flex justify-content-center gap-200">
        <button class="btn rounded" type="submit">Sign In</button>
        <button class="btn rounded" type="reset">Reset</button>
      </div>
    </form>
  </div>


  <script>

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const res = await fetch("https://code-islah-official-website.onrender.com/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      localStorage.setItem("token", data.token);
      localStorage.setItem("user", JSON.stringify(data.user));

      if (res.ok) {
        alert("Login successful!");
      } else {
        alert(data.message);
      }
    });


  </script>



</body>

</html>
