<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content=" " />
    <meta name="description" content=" " />
    <meta name="keywords" content=" " />
    <link rel="shortcut icon" type="image/x-icon" href="./img/favicon.png" />
    <link rel="stylesheet" href="/style/style.css" />
    <link rel="stylesheet" href="/style/chlng.css" />
    <link rel="stylesheet" href="/style/bootstrap-icons.css" />
    <script defer src="../js/count.js"></script>

    <title>Whack A Mole (Learning Purpose Only)</title>
    <style>
      .score {
        background: rgba(255, 255, 255, 0.2);
        padding: 0 calc(var(--padd-high) * 3);
        border-radius: 1rem;
        font-size: var(--fs-700);
      }

      .time {
        font-size: var(--fs-400);
      }

      .game {
        width: 600px;
        height: 400px;
        display: flex;
        flex-wrap: wrap;
        margin: 10vh auto 0;
      }

      .hole {
        flex: 1 0 33.33%;
        overflow: hidden;
        position: relative;
        perspective: 50px;
      }

      .hole:after {
        display: block;
        background: url(../img/dirt.svg) bottom center no-repeat;
        background-size: contain;
        content: "";
        width: 100%;
        height: 70px;
        position: absolute;
        z-index: 2;
        bottom: -30px;
      }

      .mole {
        background: url("../img/mole.svg") bottom center no-repeat;
        background-size: 60%;
        position: absolute;
        top: 100%;
        width: 100%;
        height: 100%;
        transition: all 0.4s;
      }

      .hole.up .mole {
        top: 0;
      }

      .mole.bonk {
        transform-style: preserve-3d;
        transform: rotateX(45deg) scale(0.8);
        opacity: 0.5;
      }
    </style>
  </head>

  <body>
    <div class="pos-ab left top m-high">
      <a href="/chlng.html"
        ><i class="bi bi-arrow-90deg-left clr-text-white"></i
      ></a>
    </div>

    <h1 class="text-center m-top">Whack A Mole</h1>
    <p class="text-center clr-text-warn clr-bg-dark-50 p-tiny m-block-normal">
      (Learning Purpose Only)
    </p>
    <div class="d-flex justify-content-center">
      <button class="p-normal btn uppercase width-100" onclick="startGame()">
        Start
      </button>
    </div>
    <div
      class="d-flex align-items-center m-normal justify-content-center gap-400"
    >
      <span class="time">Time : 00 sec</span>
      <span class="score">0</span>
    </div>
    <div class="game">
      <div class="hole hole1">
        <div class="mole"></div>
      </div>
      <div class="hole hole2">
        <div class="mole"></div>
      </div>
      <div class="hole hole3">
        <div class="mole"></div>
      </div>
      <div class="hole hole4">
        <div class="mole"></div>
      </div>
      <div class="hole hole5">
        <div class="mole"></div>
      </div>
      <div class="hole hole6">
        <div class="mole"></div>
      </div>
    </div>
    <script>
      const holes = document.querySelectorAll(".hole");
      const scoreBoard = document.querySelector(".score");
      const moles = document.querySelectorAll(".mole");
      const time = document.querySelector(".time");
      let timeCount = 11;
      let score = 0;
      let lastHole;
      let timeUp = false;
      function randomTime(min, max) {
        return Math.round(Math.random() * (max - min) + min);
      }

      function randomHole(holes) {
        const idx = Math.floor(Math.random() * holes.length);
        const hole = holes[idx];
        if (hole === lastHole) {
          return randomHole(holes);
        }

        lastHole = hole;
        return hole;
      }

      function peep() {
        const time = randomTime(200, 1000);
        const hole = randomHole(holes);
        hole.classList.add("up");
        setTimeout(() => {
          hole.classList.remove("up");
          if (!timeUp) {
            peep();
          }
        }, time);
      }

      function startGame() {
        scoreBoard.textContent = 0;
        timeUp = false;
        score = 0;
        peep();
        setTimeout(() => {
          timeUp = true;
        }, 10000);

        setInterval(() => {
          if (timeCount > 0) {
            timeCount--;
            time.textContent = `Time : ${timeCount} sec`;
          }
        }, 1000);
      }

      function bonk(e) {
        const time = randomTime(200, 1000);
        if (!e.isTrusted) return;
        score++;
        scoreBoard.textContent = score;
        e.target.classList.add("bonk");
        e.target.classList.remove("up");
        setTimeout(() => {
          e.target.classList.remove("bonk");
        }, 300);
      }

      moles.forEach((mole) => mole.addEventListener("click", bonk));
    </script>
  </body>
</html>
