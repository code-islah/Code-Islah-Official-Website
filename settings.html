<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content=" " />
    <meta name="description" content=" " />
    <meta name="keywords" content=" " />
    <link rel="shortcut icon" type="image/x-icon" href="/img/logo.png" />
    <link rel="stylesheet" href="/style/style.css" />
    <link rel="stylesheet" href="/style/bootstrap-icons.css" />
    <style>
      body {
        height: 90vh;
      }
      .container {
        max-width: 880px;
        margin: 0 auto;
        width: 95%;
      }

      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: var(--size-200);
      }

      form div {
        display: flex;
        align-items: center;
        justify-content: space-between;
       gap: var(--size-200);
      }

      form div:nth-child(5),
      form div:nth-child(6) {
        display: grid;
        align-items: center;
        padding: var(--size-300);
      }
      form div input,
      textarea {
        padding: var(--size-100);
        margin-right: var(--size-300);
      }

      textarea {
        width: 360px;
        max-width: 100%;
        resize: vertical;
      }
      
      label {
        padding: var(--size-300);
      }
    </style>
    <title>Edit Profile</title>
  </head>
  <body class="clr-bg-primary d-grid clr-text-white place-items-center">
    <div class="pos-ab left top m-high">
      <a href="/index.html"
        ><i class="bi bi-arrow-90deg-left clr-text-white"></i
      ></a>
    </div>
    <div class="container">
      <h2 class="h2 p-normal clr-text-light">⚙️ Edit Your Profile :</h2>
      <form action="">
        <div class="border-common rounded">
          <label> User Name: </label>
          <input type="text" />
        </div>
        <div class="border-common rounded">
          <label> Email: </label>
          <input type="text" />
        </div>
        <div class="border-common rounded">
          <label> Password: </label>
          <input type="text" />
        </div>
        <div class="border-common rounded">
          <label> Re-Password: </label>
          <input type="text" />
        </div>
        <div class="border-common rounded">
          <label> Upload Profile Image: </label>
          <input type="file" />
        </div>
        <div class="border-common rounded">
          <label> Describe Yourself : </label>
          <textarea name="" id=""></textarea>
        </div>
        <div class="d-flex justify-content-center">
          <button class="btn" type="submit">Submit</button>
        </div>
        <div class="d-flex justify-content-center">
          <button class="btn" type="reset">Reset</button>
        </div>
      </form>
    </div>
    <script></script>
  </body>
</html>
